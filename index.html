<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3e9"><meta name="description" content="A personal matcha tasting archive.">
  <title>Matcha Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header simple-header">
    <a class="brand" href="#top" aria-label="Matcha Diary home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 38C12 24 23 13 39 8M13 31C7 21 10 14 18 12c1 8 0 14-5 19ZM22 21C20 12 25 7 34 7c-1 8-5 13-12 14ZM23 31c2-9 9-12 17-9-4 8-10 11-17 9Z"/><path d="M8 39c8-7 17-10 29-10"/></svg></span><span><strong>matcha diary</strong></span></a>
  </header>
  <main id="top" class="simple-main">
    <section class="my-profile wrap" aria-labelledby="profile-title">
      <div class="my-profile-heading"><div><h1 id="profile-title">My tasting profile</h1><p class="profile-description">Average scores across all logged tastings</p></div><div class="profile-count"><strong id="profile-count">1</strong><span>tastings</span></div></div>
      <div class="average-radar-layout"><div id="average-radar" class="average-radar"></div><div id="average-score-list" class="average-score-list"></div></div>
    </section>
    <section class="archive wrap simple-archive" id="archive">
      <div class="search-area"><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Search matcha, shop, flavour or thought…" autocomplete="off"><kbd>⌘ K</kbd></label><div class="filter-row"><span class="filter-label">CAFE / MATCHA BRAND</span><div id="source-filters" class="chips"><button class="chip active" data-source="all">All entries</button></div><label class="sort-control">Sort <select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="rating">Highest rated</option><option value="name">Name A–Z</option></select></label></div></div>
      <div class="archive-meta"><span id="results-count">1 tasting</span></div>
      <div id="entry-grid" class="entry-grid"></div><div id="empty-state" class="empty-state" hidden><h3>No matcha found</h3><p>Try another name, shop or tasting note.</p><button class="button button-outline" id="clear-search">Clear search</button></div>
    </section>
  </main>
  <dialog id="entry-dialog" class="entry-dialog"><button class="dialog-close" id="dialog-close" aria-label="Close entry">×</button><div id="dialog-content"></div></dialog>
  <script src="data.js"></script><script src="app.js"></script>
</body></html>
